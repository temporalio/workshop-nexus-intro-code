[project]
name = "workshop-nexus-intro"
version = "0.1.0"
description = "Code for the Introduction to Temporal Nexus workshop (Replay 2026)"
requires-python = ">=3.14"
dependencies = [
    "temporalio>=1.24.0",
    "nexus-rpc>=1.1.0,<2",
]

[tool.uv]
# Supply-chain guard (VLN-1829): ignore package versions published in the
# last two weeks so a freshly compromised release cannot be locked.
exclude-newer = "2 weeks"
